name: Kiểm tra liên tục (CI)

on:
  push:
    branches: [main]
  pull_request:
  # Cho phép workflow cap-nhat-so-sao.yml kích hoạt CI trên nhánh cập nhật tự động
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài đặt gói phụ thuộc
        run: npm ci
      - name: Kiểm thử tự động
        run: npm test
      - name: Kiểm tra kiểu TypeScript
        run: npx tsc --noEmit
      - name: Đóng gói bản phát hành
        run: npx vite build

  quy-tac-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cài đặt gói phụ thuộc
        run: npm ci
      - name: Kiểm thử quy tắc bảo mật Firestore trên Emulator
        run: npm run test:rules
