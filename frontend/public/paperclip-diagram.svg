<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1440" width="880" height="1440" style="--bg:#FFFFFF;--fg:#3B3B3B;--line:#3B3B3B;--accent:#005FB8;--muted:#3B3B3BCC;--surface:#F8F8F8;--border:#3B3B3B;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>

<!-- TIÊU ĐỀ BẢN VẼ -->
<g class="header-box">
  <rect x="50" y="25" width="780" height="50" rx="4" fill="var(--_surface)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="440" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="var(--_text)">KIẾN TRÚC QUẢN TRỊ &amp; ĐIỀU PHỐI TÁC TỬ DOANH NGHIỆP PAPERCLIP</text>
  <text x="440" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)">Mô hình Control Plane: Quản lý phân cấp, kiểm soát ngân sách thời gian thực &amp; cổng phê duyệt con người</text>
</g>

<!-- TẦNG 1: QUẢN TRỊ CON NGƯỜI & MỤC TIÊU CHIẾN LƯỢC -->
<g class="subgraph" data-id="SG_TIER1">
  <rect x="50" y="100" width="780" height="120" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="100" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="118" font-size="12" font-weight="600" fill="var(--_text-sec)">TẦNG 1: QUẢN TRỊ CON NGƯỜI &amp; MỤC TIÊU CHIẾN LƯỢC (HUMAN GOVERNANCE)</text>

  <g class="node">
    <rect x="75" y="145" width="345" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Ban Điều Hành Doanh Nghiệp (Human)</text>
    <text x="247" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Xác lập tầm nhìn, quy tắc nghiệp vụ cốt lõi</text>
  </g>

  <g class="node">
    <rect x="460" y="145" width="350" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Thiết Lập Ngân Sách &amp; Hạn Mức Chi Phí</text>
    <text x="635" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Giới hạn Token, số tiền API tối đa mỗi tháng</text>
  </g>
</g>

<!-- Mũi tên Tầng 1 -> Tầng 2 -->
<polyline class="edge" points="440,220 440,250" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

