    <text x="440" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Điều Phối &amp; Hàng Đợi Việc</text>
    <text x="440" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Phân chia nhiệm vụ độc lập</text>
    <text x="440" y="358" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Task Queue &amp; Dispatcher</text>
  </g>

