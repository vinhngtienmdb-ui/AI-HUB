  <g class="node">
    <rect x="75" y="295" width="220" height="85" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="185" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Sơ Đồ Tổ Chức Phân Cấp</text>
    <text x="185" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Cây quan hệ Báo cáo - Thực thi</text>
    <text x="185" y="358" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Agent Org Hierarchy</text>
