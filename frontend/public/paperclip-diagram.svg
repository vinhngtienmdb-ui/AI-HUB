    <text x="697" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Kiểm Soát Ngân Sách</text>
    <text x="697" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Cảnh báo chi tiêu thời gian thực</text>
    <text x="697" y="358" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Realtime Budget Guard</text>
  </g>
</g>

<!-- Mũi tên Tầng 2 -> Tầng 3 -->
<polyline class="edge" points="440,400 440,430" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

