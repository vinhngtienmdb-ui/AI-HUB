<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1320" width="880" height="1320" style="--bg:#FFFFFF;--fg:#3B3B3B;--line:#3B3B3B;--accent:#005FB8;--muted:#3B3B3BCC;--surface:#F8F8F8;--border:#3B3B3B;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>

<!-- TIÊU ĐỀ BẢN VẼ -->
<g class="header-box">
  <rect x="50" y="25" width="780" height="50" rx="4" fill="var(--_surface)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="440" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="var(--_text)">QUY TRÌNH KHÁM PHÁ &amp; NẠP ĐỘNG KỸ NĂNG TÁC TỬ (FIND SKILLS PIPELINE)</text>
  <text x="440" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)">Khám phá kỹ năng tự động từ Prompt người dùng, kiểm định an toàn và nạp tức thì vào ngữ cảnh tác tử</text>
</g>

<!-- TẦNG 1: NHẬN DIỆN KHOẢNG TRỐNG KỸ NĂNG -->
<g class="subgraph" data-id="SG_FS_T1">
  <rect x="50" y="100" width="780" height="120" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="100" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="118" font-size="12" font-weight="600" fill="var(--_text-sec)">TẦNG 1: NHẬN DIỆN NHU CẦU &amp; KHOẢNG TRỐNG KỸ NĂNG (NEED IDENTIFICATION)</text>

  <g class="node">
    <rect x="75" y="145" width="345" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">1a. Phân Tích Prompt &amp; Ý Định Người Dùng</text>
    <text x="247" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Xác định công việc phức tạp đòi hỏi chuyên môn sâu</text>
  </g>

  <g class="node">
    <rect x="460" y="145" width="350" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">1b. Phát Hiện Khoảng Trống Kỹ Năng (Skill Gap)</text>
    <text x="635" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Tác tử hiện tại chưa được cài đặt hướng dẫn chuẩn</text>
  </g>
</g>

<!-- Mũi tên Tầng 1 -> Tầng 2 -->
<polyline class="edge" points="440,220 440,250" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- TẦNG 2: TÌM KIẾM NGỮ NGHĨA TRONG KHO SKILLS -->
<g class="subgraph" data-id="SG_FS_T2">
  <rect x="50" y="250" width="780" height="150" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="250" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="268" font-size="12" font-weight="600" fill="var(--_text-sec)">TẦNG 2: TÌM KIẾM NGỮ NGHĨA TRONG KHO KỸ NĂNG (SEMANTIC SKILL SEARCH)</text>

  <g class="node">
    <rect x="75" y="295" width="220" height="85" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="185" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Chỉ Mục Kỹ Năng Toàn Cầu</text>
    <text x="185" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Hơn 200+ bộ kỹ năng chuyên biệt</text>
    <text x="185" y="358" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Global Skills Registry</text>
  </g>

  <g class="node">
    <rect x="330" y="295" width="220" height="85" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="440" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Đối Sánh Vector Ngữ Nghĩa</text>
    <text x="440" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">So khớp mục tiêu với SKILL.md</text>
    <text x="440" y="358" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Semantic Cosine Matching</text>
  </g>

  <g class="node">
    <rect x="585" y="295" width="225" height="85" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="697" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Kiểm Tra Tính Tương Thích</text>
    <text x="697" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Tương thích với hệ điều hành và công cụ</text>
    <text x="697" y="358" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Compatibility &amp; Deps</text>
  </g>

  <polyline class="edge" points="295,337 330,337" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
  <polyline class="edge" points="550,337 585,337" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
</g>

<!-- Mũi tên Tầng 2 -> Tầng 3 -->
<polyline class="edge" points="440,400 440,430" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- TẦNG 3: CỔNG AN TOÀN & KIỂM TRA MÔI TRƯỜNG CÁCH LY -->
<g class="subgraph" data-id="SG_FS_T3">
  <rect x="50" y="430" width="780" height="250" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="430" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="448" font-size="12" font-weight="600" fill="var(--_text-sec)">TẦNG 3: KIỂM SOÁT AN TOÀN &amp; THẨM ĐỊNH KỸ NĂNG (SECURITY VERIFICATION)</text>

  <!-- Diamond Cổng Kiểm Tra An Toàn QG1 -->
  <polygon points="440,475 560,515 440,555 320,515" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="440" y="510" text-anchor="middle" font-size="12" font-weight="600" fill="var(--_text)">Cổng QG1: Kỹ Năng Đạt Chuẩn</text>
  <text x="440" y="528" text-anchor="middle" font-size="11" font-weight="500" fill="var(--accent)">An Toàn &amp; Tin Cậy Không?</text>

  <!-- Nhánh Không Đạt -> Chặn -->
  <polyline class="edge" points="560,515 720,515 720,580" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
  <g class="edge-label">
    <rect x="585" y="495" width="115" height="25" rx="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
    <text x="642" y="511" text-anchor="middle" font-size="10" font-weight="600" fill="var(--_text-sec)">Mã độc → Chặn ngay</text>
  </g>

  <g class="node">
    <rect x="620" y="580" width="195" height="65" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="717" y="605" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">Từ Chối &amp; Cảnh Báo</text>
    <text x="717" y="623" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Ngăn chặn mã nguồn không kiểm duyệt</text>
  </g>

  <!-- Nhánh Đạt Chuẩn -> Cho Phép Nạp -->
  <polyline class="edge" points="320,515 160,515 160,580" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
  <g class="edge-label">
    <rect x="180" y="495" width="115" height="25" rx="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
    <text x="237" y="511" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)">Đạt chuẩn → Nạp động</text>
  </g>

  <g class="node">
    <rect x="75" y="580" width="195" height="65" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="172" y="605" text-anchor="middle" font-size="12" font-weight="700" fill="var(--_text)">Xác Minh Giấy Phép</text>
    <text x="172" y="623" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Giấy phép mã nguồn mở hợp lệ</text>
  </g>
</g>

<!-- Mũi tên Tầng 3 -> Tầng 4 -->
<polyline class="edge" points="172,645 172,690 440,690 440,710" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- TẦNG 4: NẠP ĐỘNG VÀ KÍCH HOẠT VÀO TÁC TỬ -->
<g class="subgraph" data-id="SG_FS_T4">
  <rect x="50" y="710" width="780" height="230" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="710" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="728" font-size="12" font-weight="600" fill="var(--_text-sec)">TẦNG 4: NẠP ĐỘNG VÀO TÁC TỬ &amp; THỰC THI (DYNAMIC INJECTION &amp; EXECUTION)</text>

  <g class="node">
    <rect x="75" y="755" width="345" height="75" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="782" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Tiêm Hướng Dẫn Vào System Prompt</text>
    <text x="247" y="800" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Đọc nội dung SKILL.md và biến thành chuyên gia</text>
    <text x="247" y="816" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Instant Agent Specialization</text>
  </g>

  <g class="node">
    <rect x="460" y="755" width="350" height="75" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="782" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Đăng Ký Script &amp; Lời Gọi Công Cụ Mới</text>
    <text x="635" y="800" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Kích hoạt CLI scripts và MCP endpoints phụ trợ</text>
    <text x="635" y="816" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Tools &amp; Scripts Registration</text>
  </g>

  <g class="node">
    <rect x="75" y="855" width="735" height="60" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="440" y="878" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">Tác Tử Hoàn Thành Nhiệm Vụ Với Kỹ Năng Mới</text>
    <text x="440" y="898" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Tự giải phóng bộ nhớ khi kết thúc tác vụ, đảm bảo tài nguyên hệ thống luôn tối ưu</text>
  </g>

  <polyline class="edge" points="247,830 247,842 440,842 440,855" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
  <polyline class="edge" points="635,830 635,842 440,842 440,855" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
</g>

<!-- CHÂN TRANG GHI CHÚ -->
<g class="footer-box">
  <rect x="50" y="965" width="780" height="60" rx="4" fill="var(--_surface)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="440" y="990" text-anchor="middle" font-size="11" font-weight="600" fill="var(--_text)">TIÊU CHUẨN FIND SKILLS (VERCEL LABS)</text>
  <text x="440" y="1008" text-anchor="middle" font-size="10" font-weight="400" fill="var(--_text-sec)">Cơ chế Zero-Config • Tự động giải phóng khi xong việc • Tương thích mọi tác tử AI tiêu chuẩn</text>
</g>

</svg>
