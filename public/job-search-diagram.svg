<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1520" width="880" height="1520" style="--bg:#FFFFFF;--fg:#3B3B3B;--line:#3B3B3B;--accent:#005FB8;--muted:#3B3B3BCC;--surface:#F8F8F8;--border:#3B3B3B;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>

<!-- TIÊU ĐỀ BẢN VẼ -->
<g class="header-box">
  <rect x="50" y="25" width="780" height="50" rx="4" fill="var(--_surface)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="440" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="var(--_text)">QUY TRÌNH TỰ ĐỘNG HÓA SĂN VIỆC ĐA TÁC TỬ (AI JOB SEARCH PIPELINE)</text>
  <text x="440" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)">Chuỗi 6 bước khép kín tích hợp Tác tử phản biện (Critic Agent) và Cổng kiểm soát chất lượng chuẩn ATS</text>
</g>

<!-- BƯỚC 1: KHỞI TẠO HỒ SƠ ỨNG VIÊN -->
<g class="subgraph" data-id="SG_STEP1">
  <rect x="50" y="100" width="780" height="120" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="100" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="118" font-size="12" font-weight="600" fill="var(--_text-sec)">BƯỚC 1: THIẾT LẬP HỒ SƠ &amp; TIÊU CHÍ NGHỀ NGHIỆP (/setup)</text>

  <g class="node">
    <rect x="75" y="145" width="345" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">1a. Nạp Hồ Sơ &amp; Kỹ Năng Cốt Lõi</text>
    <text x="247" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">CV gốc, danh mục dự án, chứng chỉ kỹ thuật</text>
  </g>

  <g class="node">
    <rect x="460" y="145" width="350" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">1b. Cấu Hình Tiêu Chí Mục Tiêu</text>
    <text x="635" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Vị trí mong muốn, dải lương, địa điểm &amp; Remote</text>
  </g>
</g>

<!-- Mũi tên Bước 1 -> Bước 2 -->
<polyline class="edge" points="440,220 440,250" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- BƯỚC 2: QUÉT TIN TUYỂN DỤNG TỰ ĐỘNG -->
<g class="subgraph" data-id="SG_STEP2">
  <rect x="50" y="250" width="780" height="120" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="250" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="268" font-size="12" font-weight="600" fill="var(--_text-sec)">BƯỚC 2: THU THẬP &amp; PHÂN TÍCH TIN TUYỂN DỤNG (/scrape)</text>

  <g class="node">
    <rect x="75" y="295" width="345" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">2a. Trích Xuất Tin Tuyển Dụng Đa Nền Tảng</text>
    <text x="247" y="338" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">LinkedIn, Indeed, Glassdoor, TopCV, ITviec</text>
  </g>

  <g class="node">
    <rect x="460" y="295" width="350" height="58" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">2b. Phân Tích Cấu Trúc Yêu Cầu (JD Parsing)</text>
    <text x="635" y="338" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Trích xuất từ khóa chuyên môn, trách nhiệm chính</text>
  </g>
</g>

<!-- Mũi tên Bước 2 -> Bước 3 -->
<polyline class="edge" points="440,370 440,400" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- BƯỚC 3: MAY ĐO HỒ SƠ & TÁC TỬ PHẢN BIỆN (CRITIC AGENT) -->
<g class="subgraph" data-id="SG_STEP3">
  <rect x="50" y="400" width="780" height="310" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="400" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="418" font-size="12" font-weight="600" fill="var(--_text-sec)">BƯỚC 3: TỰ ĐỘNG MAY ĐO HỒ SƠ &amp; THẨM ĐỊNH PHẢN BIỆN (/apply)</text>

  <g class="node">
    <rect x="75" y="445" width="345" height="65" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">3a. Tác Tử May Đo CV Chuyên Biệt</text>
    <text x="247" y="488" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Viết lại kinh nghiệm bám sát 100% từ khóa JD</text>
    <text x="247" y="502" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Resume Tailoring Agent</text>
  </g>

  <g class="node">
    <rect x="460" y="445" width="350" height="65" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">3b. Soạn Thảo Thư Ứng Tuyển Cá Nhân Hóa</text>
    <text x="635" y="488" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Thể hiện văn hóa doanh nghiệp &amp; động lực cống hiến</text>
    <text x="635" y="502" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Cover Letter Agent</text>
  </g>

  <!-- Mũi tên từ 2 tác tử xuống Cổng phản biện -->
  <polyline class="edge" points="247,510 247,535 440,535" fill="none" stroke="var(--_line)" stroke-width="1" />
  <polyline class="edge" points="635,510 635,535 440,535" fill="none" stroke="var(--_line)" stroke-width="1" />
  <polyline class="edge" points="440,535 440,560" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

  <!-- Diamond Cổng Kiểm Soát Chất Lượng Phản Biện QG1 -->
  <polygon points="440,560 560,605 440,650 320,605" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="440" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="var(--_text)">Cổng QG1: Critic Agent</text>
  <text x="440" y="618" text-anchor="middle" font-size="11" font-weight="500" fill="var(--accent)">Thẩm định phản biện đạt chuẩn?</text>

  <!-- Nhánh Không đạt -> Quay lại viết lại -->
  <polyline class="edge" points="320,605 180,605 180,510" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowhead)" />
  <g class="edge-label">
    <rect x="195" y="585" width="105" height="25" rx="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
    <text x="247" y="601" text-anchor="middle" font-size="10" font-weight="600" fill="var(--_text-sec)">Chưa đạt → Tinh chỉnh</text>
  </g>

  <!-- Nhãn Đạt chuẩn -->
  <g class="edge-label">
    <rect x="450" y="660" width="100" height="25" rx="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
    <text x="500" y="676" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)">Đạt chuẩn chất lượng</text>
  </g>
</g>

<!-- Mũi tên từ Bước 3 -> Bước 4 -->
<polyline class="edge" points="440,650 440,730" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- BƯỚC 4: BIÊN DỊCH PDF & TỐI ƯU ATS -->
<g class="subgraph" data-id="SG_STEP4">
  <rect x="50" y="730" width="780" height="230" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="730" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="748" font-size="12" font-weight="600" fill="var(--_text-sec)">BƯỚC 4: BIÊN DỊCH PDF &amp; TỐI ƯU HÓA ĐIỂM CHUẨN ATS (ATS OPTIMIZATION)</text>

  <g class="node">
    <rect x="75" y="775" width="730" height="55" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="440" y="798" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Biên Dịch Định Dạng Chuẩn ATS &amp; Trình Bày Chuyên Nghiệp</text>
    <text x="440" y="816" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Sử dụng cấu trúc 1 cột, không bảng biểu lồng ghép phức tạp, định dạng font chữ chuẩn máy đọc</text>
  </g>

  <!-- Diamond Cổng Kiểm Tra Điểm ATS QG2 -->
  <polygon points="440,845 560,885 440,925 320,885" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="440" y="880" text-anchor="middle" font-size="12" font-weight="600" fill="var(--_text)">Cổng QG2: Điểm Quét ATS</text>
  <text x="440" y="898" text-anchor="middle" font-size="11" font-weight="500" fill="var(--accent)">Đạt tỷ lệ khớp ≥ 85%?</text>

  <!-- Nhánh Không đạt -> Quay lại Bước 3 -->
  <polyline class="edge" points="320,885 100,885 100,475 75,475" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowhead)" />
  <g class="edge-label">
    <rect x="120" y="865" width="130" height="25" rx="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
    <text x="185" y="881" text-anchor="middle" font-size="10" font-weight="600" fill="var(--_text-sec)">Điểm thấp → Bổ sung từ khóa</text>
  </g>
</g>

<!-- Mũi tên Bước 4 -> Bước 5 -->
<polyline class="edge" points="440,925 440,980" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- BƯỚC 5: HUẤN LUYỆN & MÔ PHỎNG PHỎNG VẤN 1-1 -->
<g class="subgraph" data-id="SG_STEP5">
  <rect x="50" y="980" width="780" height="150" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="980" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="998" font-size="12" font-weight="600" fill="var(--_text-sec)">BƯỚC 5: MÔ PHỎNG &amp; HUẤN LUYỆN PHỎNG VẤN 1-1 (/interview)</text>

  <g class="node">
    <rect x="75" y="1025" width="345" height="75" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="1052" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Mô Phỏng Nhà Tuyển Dụng</text>
    <text x="247" y="1070" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Đặt câu hỏi tình huống chuyên sâu</text>
    <text x="247" y="1086" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Dựa trên kinh nghiệm và lỗ hổng CV</text>
  </g>

  <g class="node">
    <rect x="460" y="1025" width="350" height="75" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="1052" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Gợi Ý Câu Trả Lời Chuẩn STAR</text>
    <text x="635" y="1070" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Situation • Task • Action • Result</text>
    <text x="635" y="1086" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Đề xuất cải thiện phản xạ và lập luận</text>
  </g>
</g>

<!-- Mũi tên Bước 5 -> Bước 6 -->
<polyline class="edge" points="440,1130 440,1160" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

<!-- BƯỚC 6: XẾP HẠNG & THEO DÕI NỘP HỒ SƠ -->
<g class="subgraph" data-id="SG_STEP6">
  <rect x="50" y="1160" width="780" height="150" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="50" y="1160" width="780" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="65" y="1178" font-size="12" font-weight="600" fill="var(--_text-sec)">BƯỚC 6: XẾP HẠNG CƠ HỘI &amp; THEO DÕI TIẾN TRÌNH (/rank)</text>

  <g class="node">
    <rect x="75" y="1205" width="345" height="75" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="247" y="1232" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Bảng Xếp Hạng Mức Độ Tương Thích</text>
    <text x="247" y="1250" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Ưu tiên cơ hội có tỷ lệ trúng tuyển cao nhất</text>
    <text x="247" y="1266" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Compatibility Matrix Scoring</text>
  </g>

  <g class="node">
    <rect x="460" y="1205" width="350" height="75" rx="0.75" ry="0.75" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
    <text x="635" y="1232" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Quản Lý Toàn Bộ Vòng Ứng Tuyển</text>
    <text x="635" y="1250" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)">Theo dõi trạng thái: Đã gửi, Phỏng vấn, Nhận Offer</text>
    <text x="635" y="1266" text-anchor="middle" font-size="10" font-weight="500" fill="var(--accent)">Application Lifecycle Tracker</text>
  </g>
</g>

<!-- CHÂN TRANG GHI CHÚ -->
<g class="footer-box">
  <rect x="50" y="1335" width="780" height="60" rx="4" fill="var(--_surface)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="440" y="1360" text-anchor="middle" font-size="11" font-weight="600" fill="var(--_text)">CAM KẾT CHẤT LƯỢNG VÀ HIỆU QUẢ CỦA BỘ CÔNG CỤ AI JOB SEARCH</text>
  <text x="440" y="1378" text-anchor="middle" font-size="10" font-weight="400" fill="var(--_text-sec)">Tăng tỷ lệ gọi phỏng vấn lên 3.5 lần • Bảo mật thông tin ứng viên tuyệt đối • Không tạo dữ liệu ảo không có thật</text>
</g>

</svg>
